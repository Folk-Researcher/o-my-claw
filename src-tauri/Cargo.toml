[package]
name = "o-my-claw"
version = "0.1.0"
description = "OpenClaw 图形化管理器"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/yourname/o-my-claw"
edition = "2021"
rust-version = "1.70"

[dependencies]
tauri = { version = "2.5.6", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
